---
apiVersion: v1
kind: Namespace
metadata:
  name: #{namespace}  # Maybe terraform to make this dynamic for multiple envs.
  labels:
    env: #{namespace}
    project: website
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: #{namespace}
  labels:
    env: #{namespace}
    project: website
    name: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      env: #{namespace}
      project: website
      name: ui
  template:
    metadata:
      name: ui
      namespace: #{namespace}
      labels:
        env: #{namespace}
        project: website
        name: ui
    spec:
      containers:
        - image: medkha/website:#{version}
          name: ui
          # Experimenting, not sure yet the optimal values.
          resources:
            requests:
              memory: 20Mi
            limits:
              memory: 50Mi
          volumeMounts:
            - name: analytics
              mountPath: /usr/share/nginx/html/analytics.js
              subPath: analytics.js
              readOnly: true
---
# the autoscaler is not needed on
# the test environment in the future
# When we have the project deployed in staging and prod.
# For now the test env is the prod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ui-hpa
  namespace: #{namespace}
  labels:
    env: #{namespace}
    project: website
    name: ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ui
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          averageUtilization: 80
          type: Utilization
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: #{namespace}
  labels:
    env: #{namespace}
    project: website
    name: ui
spec:
  selector:
    name: ui
    project: website
    env: #{namespace}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui
  namespace: #{namespace}
  labels:
    env: #{namespace}
    project: website
    name: ui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  rules:
    - host: #{host-prefix}.medkha.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
  tls:
    - hosts:
        - #{host-prefix}.medkha.com
      secretName: #{namespace}
